<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">HACKPRENEUR prototype architecture</title><desc id="desc">Browser and demo roles use the Next.js App Router, consent-gated API routes, explainable scoring, and a local SQLite database managed through Drizzle ORM. External messaging is not connected.</desc><defs><style>.bg{fill:#fafaf7}.box{fill:#fff;stroke:#25253a;stroke-width:3;rx:20}.soft{fill:#e9e3ff}.green{fill:#d5f7ee}.peach{fill:#ffe3d3}.ink{fill:#17172c;font:700 22px Arial,sans-serif}.small{fill:#4e4e62;font:16px Arial,sans-serif}.arrow{stroke:#7c5cff;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#8c83ad;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#b)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#7c5cff"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#8c83ad"/></marker></defs><rect class="bg" width="1200" height="690"/><text class="ink" x="55" y="58" font-size="30">HACKPRENEUR · prototype architecture</text><text class="small" x="55" y="88">Synthetic demo records only · No real auth, outbound reminders, or guaranteed introductions</text><rect class="box soft" x="55" y="150" width="230" height="140"/><text class="ink" x="80" y="194">Browser UI</text><text class="small" x="80" y="225">Team · Mentor · Organizer</text><text class="small" x="80" y="250">Role selector + consent</text><rect class="box" x="390" y="125" width="360" height="200"/><text class="ink" x="425" y="170">Next.js App Router</text><text class="small" x="425" y="204">Pages · forms · responsive UI</text><text class="small" x="425" y="234">Server-rendered DB reads</text><text class="small" x="425" y="264">Role-scoped API routes</text><rect class="box green" x="855" y="125" width="290" height="200"/><text class="ink" x="885" y="170">SQLite + Drizzle</text><text class="small" x="885" y="204">Local ignored DB file</text><text class="small" x="885" y="234">Profiles · milestones</text><text class="small" x="885" y="264">Consent · matches · audit</text><path class="arrow" d="M285 220H380"/><path class="arrow" d="M750 220H845"/><rect class="box peach" x="390" y="400" width="360" height="185"/><text class="ink" x="425" y="445">Transparent domain logic</text><text class="small" x="425" y="480">Explainable match scoring</text><text class="small" x="425" y="510">Readiness + milestone rules</text><text class="small" x="425" y="540">Continuation + verification</text><path class="dash" d="M570 325V390"/><path class="dash" d="M855 290C815 355 790 405 760 445"/><rect class="box" x="855" y="410" width="290" height="145"/><text class="ink" x="885" y="455">External services</text><text class="small" x="885" y="490">Not connected in prototype</text><text class="small" x="885" y="520">No email/SMS or auth provider</text><path class="dash" d="M1000 325V400"/><text class="small" x="55" y="640">Deploy note: local SQLite is for this demo. Public serverless hosting needs a durable hosted DB and production auth/authorization.</text></svg>